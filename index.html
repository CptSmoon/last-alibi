<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Alibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Pixelify+Sans:wght@600&display=swap">
<style>
:root { --parch: #f5ead0; --parch2: #ecdcb6; --edge: #b4893d; --edge2: #8a6224; --ink: #3a2414; --muted: #7a5a3a; --wine: #7a2236; --green: #3f7a5a; --red: #b8322a;
  --ui: "Nunito", "Trebuchet MS", system-ui, sans-serif; --title: "Pixelify Sans", "Nunito", monospace; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #0d0805; overflow: hidden; font-family: var(--ui); color: var(--ink); }
body { display: grid; place-items: center; }
#stage { position: relative; overflow: hidden; box-shadow: 0 0 0 3px #2a1a10, 0 30px 80px #000; background: #120b07; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
kbd { font: 800 .8em var(--ui); background: #fff; border: 1px solid var(--edge); border-bottom-width: 3px; border-radius: .3em; padding: 0 .35em; margin: 0 .15em; }
button { font-family: var(--ui); }

/* parchment */
.parch { background: linear-gradient(var(--parch), var(--parch2)); border: .18em solid var(--edge); border-radius: .5em;
  box-shadow: inset 0 0 0 .12em #fff6dc, inset 0 0 0 .22em rgba(180,137,61,.45), 0 .25em 0 rgba(58,36,20,.35), 0 .5em 1.2em rgba(0,0,0,.35); }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.btns { position: absolute; left: 1em; top: .9em; display: flex; gap: .45em; }
.sq { width: 3.3em; height: 3.3em; display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--ink); }
.sq svg { width: 1.8em; height: 1.8em; }
.sq:hover, .sq:focus-visible { transform: translateY(-.1em); outline: none; border-color: #e0a72e; }
#place { position: absolute; left: 50%; top: .8em; transform: translateX(-50%); padding: .55em 2.6em; font: 800 1.2em var(--ui); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
  border-radius: .35em; }
#place::before, #place::after { content: "◆"; position: absolute; top: 50%; transform: translateY(-50%); color: var(--edge); font-size: .6em; }
#place::before { left: 1.2em; } #place::after { right: 1.2em; }
#clock { position: absolute; right: 1em; top: .9em; padding: .5em 1em; font: 800 1.15em var(--ui); font-variant-numeric: tabular-nums; }
#clock.urgent { color: var(--red); }
#hint { position: absolute; left: 50%; top: 4.9em; transform: translateX(-50%); padding: .45em 1.1em; font: 700 1em var(--ui); white-space: nowrap; background: rgba(245,234,208,.95); }
#toasts { position: absolute; right: 1em; top: 4.6em; display: grid; gap: .5em; justify-items: end; pointer-events: none; }
.toast { display: flex; align-items: center; gap: .6em; padding: .45em .9em .45em .6em; font: 700 .95em var(--ui); animation: tin .3s ease-out; transition: opacity .5s, transform .5s;
  background: var(--parch); border: .15em solid var(--edge); border-left: .45em solid var(--green); border-radius: .4em; box-shadow: 0 .3em .8em rgba(0,0,0,.35); max-width: 26em; }
.toast.note { border-left-color: #4a78a8; } .toast.alert { border-left-color: var(--red); }
.toast img { width: 2.2em; height: 2.2em; object-fit: contain; }
.toast.out { opacity: 0; transform: translateX(1em); }
@keyframes tin { from { opacity: 0; transform: translateX(1em); } }

/* captions + cards */
#caption { position: absolute; left: 0; right: 0; bottom: 2.4em; text-align: center; color: #f5ead0; text-shadow: 0 .15em .4em #000; pointer-events: none; }
#caption p { margin: .2em 0; font: 700 1.3em var(--ui); } #caption p.big { font: 800 1.9em var(--ui); }
#card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: #120b07; color: #f5ead0; transition: opacity .5s; }
#card p { margin: .3em 0; font: 700 1.55em var(--ui); } #card p:first-child { font: 800 2.1em var(--ui); color: #f0c46a; }
#card.out { opacity: 0; }

/* dialogue */
#dialog { position: absolute; left: 50%; bottom: 1em; transform: translateX(-50%); width: 60em; display: grid; grid-template-columns: 8.2em 1fr; gap: 0 1em; padding: .8em 1em .8em .8em; }
#dlg-portrait { grid-row: span 3; width: 8.2em; height: 8.2em; object-fit: cover; object-position: top; border-radius: .35em; border: .15em solid var(--edge); background: #3a2414; }
#dlg-name { position: absolute; left: 9.6em; top: -1.15em; padding: .2em .9em; font: 900 1em var(--ui); background: var(--wine); color: #f5ead0; border: .15em solid var(--edge); border-radius: .4em; letter-spacing: .03em; }
#dialog[data-who="you"] #dlg-name { background: #35557a; }
#dlg-text { min-height: 4.6em; font: 600 1.17em/1.45 var(--ui); padding-top: .35em; }
#dialog[data-who="you"] #dlg-text { color: #35557a; font-style: italic; }
#dialog.thinking #dlg-text::after { content: " …"; animation: dots 1s steps(3) infinite; }
@keyframes dots { 50% { opacity: .3; } }
#dlg-chips { display: flex; flex-wrap: wrap; gap: .4em; margin: .3em 0; }
.chip { font: 700 .88em var(--ui); background: #fff8e6; border: .12em dashed var(--edge); color: var(--ink); border-radius: 1em; padding: .25em .8em .25em .35em; cursor: pointer; }
.chip:hover { background: #fff; border-style: solid; } .chip kbd { font-size: .8em; }
.askrow { display: flex; gap: .45em; align-items: center; }
#dlg-input { flex: 1; min-width: 0; font: 600 1em var(--ui); padding: .5em .8em; border: .12em solid var(--edge); border-radius: .4em; background: #fffdf5; color: var(--ink); }
.pill { font: 800 .92em var(--ui); padding: .5em .9em; border-radius: .4em; border: .12em solid var(--edge2); background: #f0c46a; color: var(--ink); cursor: pointer; white-space: nowrap; }
.pill.ghost { background: #fff8e6; } .pill:hover { filter: brightness(1.06); }
#dlg-mic { display: none; } #dialog.voice #dlg-mic { display: inline-block; }
#dialog.listening #dlg-mic { background: var(--red); color: #fff; }

/* examine */
#examine { position: absolute; left: 50%; bottom: 1em; transform: translateX(-50%); width: 48em; display: grid; grid-template-columns: auto 1fr; gap: .4em 1.1em; padding: 1em 1.2em; align-items: start; }
#ex-img { width: 6em; height: 6em; object-fit: contain; grid-row: span 3; background: radial-gradient(#fff8e6, transparent 70%); }
#ex-title { font: 900 1.25em var(--ui); } #ex-text { font: 600 1.05em/1.45 var(--ui); margin: 0; }
#ex-act { justify-self: end; grid-column: 2; }

/* panels */
#panel { z-index: 3; /* above #menu, which comes later in the page: Settings opens from the title menu */ position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 56em; max-height: 36em; display: grid; grid-template-rows: auto 1fr; padding: 1em 1.2em; }
#panel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .6em; }
#panel-title { font: 900 1.4em var(--ui); }
#panel-body { overflow: auto; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.4em, 1fr)); gap: .6em; }
.slot { display: grid; justify-items: center; gap: .2em; padding: .5em .3em; background: #fff8e6; border: .15em solid var(--edge); border-radius: .4em; cursor: pointer; font: 700 .78em var(--ui); color: var(--ink); }
.slot:hover, .slot:focus-visible { border-color: #e0a72e; background: #fff; outline: none; }
.slot img { width: 3.6em; height: 3.6em; object-fit: contain; }
.slot em { font-style: normal; text-align: center; line-height: 1.15; }
.factmark { width: 2.6em; height: 2.6em; margin: .5em; display: grid; place-items: center; border-radius: 50%; background: #35557a; color: #fff; font: 900 1.3em var(--ui); }
.slot-detail { margin-top: .8em; padding: .7em .9em; background: #fff8e6; border-radius: .4em; font: 600 1em/1.45 var(--ui); min-height: 4em; }
.kind { font-size: .8em; color: var(--green); font-weight: 800; }
.empty { font: 600 1.05em var(--ui); color: var(--muted); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(16em, 1fr)); gap: .7em; }
.person { display: grid; grid-template-columns: 4.4em 1fr; gap: .7em; padding: .6em; background: #fff8e6; border: .12em solid var(--edge); border-radius: .4em; }
.person img, .deadpic { width: 4.4em; height: 4.4em; object-fit: cover; object-position: top; border-radius: .3em; }
.deadpic { display: grid; place-items: center; background: #3a2414; color: #f5ead0; font-size: 2em; }
.person > img, .person > .deadpic { width: 100%; height: auto; aspect-ratio: 1; min-width: 0; overflow: hidden; } /* sized by the 4.4em column, whatever the font size: never spills over the text */
.person.dead h4 { color: #1a100a; } .person.dead .status { color: var(--wine); }
.person h4 { margin: 0; font: 900 1em var(--ui); } .person .role { margin: 0; font-size: .85em; color: var(--muted); }
.person .status { margin: .2em 0; font: 800 .8em var(--ui); color: var(--green); } .person ul { margin: 0; padding-left: 1.1em; font-size: .85em; }
.set { display: flex; justify-content: space-between; align-items: center; padding: .6em 0; border-bottom: .1em solid rgba(180,137,61,.4); font: 800 1.05em var(--ui); }
.set small { display: block; font: 600 .8em var(--ui); color: var(--muted); }
.set button { font: 800 1em var(--ui); min-width: 7em; padding: .4em .8em; background: #f0c46a; border: .12em solid var(--edge2); border-radius: .4em; cursor: pointer; }
.set.off { opacity: .5; }
.set input[type=range] { width: 9em; accent-color: #c67a2f; cursor: pointer; }
.train { display: flex; align-items: center; justify-content: center; gap: 0; margin: 1em 0; }
.car { padding: .9em 1.2em; background: #fff8e6; border: .15em solid var(--edge); border-radius: .5em; display: grid; text-align: center; min-width: 9em; }
.car span { font-size: .8em; color: var(--muted); } .car.here { background: #f0c46a; }
.coupling { width: 1.4em; height: .3em; background: var(--edge2); }

/* menu: the Last Alibi title screen, then the case library */
#menu { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; color: #f5ead0;
  background: radial-gradient(ellipse at 50% 38%, #4a2c16 0%, #24150b 45%, #0d0805 100%); }
#menu::before { content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px); }
#menu .view { position: relative; display: grid; justify-items: center; }
#menu-logo { width: 26em; height: 26em; margin: -1em 0 .4em; filter: drop-shadow(0 .6em 1.2em rgba(0,0,0,.6)); animation: logo-in .7s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes logo-in { from { transform: scale(.85) translateY(-.6em); opacity: 0; } }
#menu-list { display: grid; gap: .6em; width: 18em; }
.mbtn { font: 900 1.3em var(--ui); padding: .6em; cursor: pointer; color: var(--ink); }
.mbtn:hover, .mbtn:focus-visible { outline: none; border-color: #e0a72e; transform: translateY(-.08em); }
#menu-sub { margin-top: 1.2em; font: 600 .9em var(--ui); opacity: .7; text-align: center; }
#menu h2 { margin: 0 0 1em; font: 600 2.4em var(--title); color: #f0c46a; text-shadow: 0 .08em 0 #3a2414, 0 .2em .5em rgba(0,0,0,.6); }
.cases { display: grid; grid-template-columns: repeat(3, 20em); gap: 1.4em; }
.case { position: relative; display: grid; grid-template-rows: auto 1fr; padding: 0; overflow: hidden; text-align: left; cursor: pointer; color: var(--ink); font: inherit; }
.case .art { aspect-ratio: 16 / 10; background: #2a1a10 center / cover; display: grid; place-items: center; border-bottom: .18em solid var(--edge); }
.case .art b { font: 600 4em var(--title); color: rgba(245,234,208,.25); }
.case .txt { padding: .8em 1em 1em; display: grid; gap: .3em; align-content: start; }
.case .t { font: 900 1.15em/1.2 var(--ui); }
.case .m { font: 800 .8em var(--ui); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.case .d { font: 600 .9em/1.4 var(--ui); margin: .2em 0 0; }
.case .play { justify-self: start; margin-top: .5em; font: 900 .95em var(--ui); padding: .35em 1.1em; background: var(--red); color: #fff; border: .15em solid #7a1a14; border-radius: .4em; }
.case:not([disabled]):hover, .case:not([disabled]):focus-visible { outline: none; border-color: #e0a72e; transform: translateY(-.15em); }
.case[disabled] { cursor: default; filter: saturate(.3) brightness(.8); }
.case .soon { position: absolute; top: .8em; right: .8em; padding: .3em .8em; border-radius: .3em; background: #f0c46a; color: #3a2414; font: 900 .75em var(--ui); letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 .15em 0 rgba(0,0,0,.35); }
#menu .back { justify-self: center; margin-top: 1.4em; color: #f5ead0; border-color: rgba(245,234,208,.4); }

/* accusation */
#accuse { position: absolute; inset: 0; background: rgba(18,11,7,.72); display: grid; place-items: center; }
#accuse .inner { width: 62em; padding: 1.2em 1.4em; }
#acc-title { font: 900 1.7em var(--ui); text-align: center; margin: 0 0 .8em; }
.suspects { display: grid; grid-template-columns: repeat(6, 1fr); gap: .7em; }
.sus { display: grid; gap: .4em; justify-items: center; padding: .6em; background: #fff8e6; border: .15em solid var(--edge); border-radius: .5em; cursor: pointer; font: 800 .95em var(--ui); color: var(--ink); }
.sus img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: top; border-radius: .3em; }
.sus:hover { border-color: var(--red); background: #fff; }
.motives { display: grid; gap: .5em; }
.mot, .proof, .back { font: 700 1.05em var(--ui); text-align: left; padding: .6em .9em; background: #fff8e6; border: .15em solid var(--edge); border-radius: .4em; cursor: pointer; color: var(--ink); }
.mot:hover, .proof:hover { border-color: #e0a72e; background: #fff; }
.back { justify-self: start; margin-top: .6em; background: none; border-style: dashed; }
.proofs { display: grid; grid-template-columns: repeat(auto-fill, minmax(17em, 1fr)); gap: .5em; max-height: 22em; overflow: auto; }
.proof { display: flex; align-items: center; gap: .6em; font-size: .95em; } .proof img { width: 2.4em; height: 2.4em; object-fit: contain; }
.proof.on { background: #dff0d4; border-color: var(--green); }
.accbar { display: flex; justify-content: space-between; align-items: center; margin-top: .8em; font: 800 1em var(--ui); }
.go { font: 900 1.1em var(--ui); padding: .6em 1.6em; background: var(--red); color: #fff; border: .15em solid #7a1a14; border-radius: .4em; cursor: pointer; } .go:disabled { opacity: .4; cursor: default; }

/* ending */
#ending { position: absolute; inset: 0; background: #e9dfc4; display: grid; place-content: center; padding: 2em 6em; text-align: center; color: #1a100a; }
#ending .mast { font: 900 3em var(--title); border-block: .12em solid #1a100a; padding: .2em 0; margin: 0; }
#ending .date { font: 700 1em var(--ui); margin: .4em 0 1.2em; letter-spacing: .1em; text-transform: uppercase; }
#end-head { font: 900 2em/1.15 var(--ui); color: #5e1627; margin: 0 0 .6em; text-wrap: balance; }
#end-body { font: 600 1.25em/1.5 var(--ui); max-width: 44em; margin: 0 auto 1em; }
#end-found { font: 700 1em var(--ui); color: #5a3a20; }
#end-again { justify-self: center; margin-top: 1.4em; }
</style></head><body>
<div id="stage">
  <canvas id="game" aria-label="The game"></canvas>

  <div id="hud" hidden>
    <div class="btns">
      <button class="sq parch" id="btn-brief" title="Your case: what to do" aria-label="Your case" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.6 10.8c.8.6 1.1 1.3 1.1 2.2h5c0-.9.3-1.6 1.1-2.2A6 6 0 0012 3z"/></svg></button>
      <button class="sq parch" id="btn-map" title="The train (M)" aria-label="Map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
      <button class="sq parch" id="btn-people" title="Notebook (J)" aria-label="Notebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5M14.5 14.2c3.5-.5 6.5 1 6.5 4.8"/></svg></button>
      <button class="sq parch" id="btn-note" title="Quick note (N)" aria-label="Quick note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3M4 20h6"/></svg></button>
      <button class="sq parch" id="btn-bag" title="Inventory (I)" aria-label="Inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12.5" rx="2"/><path d="M9 7.5V5.5a1.5 1.5 0 011.5-1.5h3A1.5 1.5 0 0115 5.5v2"/><path d="M3 12.5h18"/><path d="M7.5 7.5v12.5M16.5 7.5v12.5"/></svg></button>
      <button class="sq parch" id="btn-settings" title="Settings (Esc)" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    </div>
    <div id="place" class="parch">Dining car</div>
    <div id="clock" class="parch">07:00</div>
    <div id="hint" class="parch" hidden></div>
    <button id="casepill" class="parch" title="Your case: what to do, and how strong it is" hidden></button>
  </div>
  <div id="toasts"></div>
  <div id="caption" hidden></div>

  <div id="examine" class="parch" hidden><img id="ex-img" alt=""><div id="ex-title"></div><p id="ex-text"></p><button id="ex-act" class="pill">OK</button></div>

  <div id="dialog" class="parch" hidden>
    <img id="dlg-portrait" alt="">
    <div id="dlg-name"></div>
    <div id="dlg-text"></div>
    <div>
      <div id="dlg-chips"></div>
      <div class="askrow">
        <button id="dlg-mic" class="pill" title="Click (or press Space), speak, then click again">🎙 Talk</button>
        <input id="dlg-input" placeholder="Ask anything…" autocomplete="off">
        <button id="dlg-send" class="pill ghost">Ask</button>
        <button id="dlg-show" class="pill ghost" title="Show an item or tell a fact (Tab)">Show…</button>
        <button id="dlg-note" class="pill ghost" title="Quick note (Alt+N)">✎ Note</button>
        <button id="dlg-leave" class="pill ghost" title="Leave (Esc)">Leave</button>
      </div>
    </div>
  </div>

  <div id="panel" class="parch" hidden><header><div id="panel-title"></div><button id="panel-close" class="pill ghost">Close</button></header><div id="panel-body"></div></div>
  <div id="card" hidden></div>
  <div id="brief" hidden></div>
  <div id="menu" hidden><div class="view" id="menu-main"><img id="menu-logo" src="game-assets/ui/last-alibi-logo.webp" alt="Last Alibi"><div id="menu-list"></div><div id="menu-sub"></div></div><div class="view" id="menu-cases" hidden></div></div>
  <div id="accuse" hidden><div class="inner parch"><h2 id="acc-title"></h2><div id="acc-body"></div></div></div>
  <div id="ending" hidden><p class="mast">La Gazzetta del Sempione</p><p class="date">Domodossola · Sabato 19 dicembre 1931</p><h2 id="end-head"></h2><p id="end-body"></p><p id="end-found"></p><button id="end-again" class="pill">Back to the menu</button></div>
</div>
<script src="assets/log.js"></script>
<script src="engine/map.js"></script>
<script src="engine/minimap.js"></script>
<script src="assets/case-data.js"></script><script src="assets/demo-dialogue.js"></script><script src="assets/voice.js"></script>
<script src="engine/cases.js"></script><script src="engine/scenes.js"></script><script src="engine/ui.js"></script><script src="engine/engine.js"></script><script src="engine/dialogue.js"></script><script src="engine/audio.js"></script><script src="engine/notes.js"></script><script src="engine/board.js"></script><script src="engine/game.js"></script>
</body></html>
